<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KURD PASS</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    font-family:Arial,Tahoma,sans-serif;
}

body{
    min-height:100vh;
    background:linear-gradient(135deg,#07111f,#123b68);
    color:#fff;
}

.hidden{
    display:none!important;
}

.container{
    width:100%;
    max-width:450px;
    margin:auto;
    padding:20px;
}

.card{
    background:rgba(255,255,255,.10);
    border:1px solid rgba(255,255,255,.15);
    backdrop-filter:blur(15px);
    border-radius:24px;
    padding:25px;
    box-shadow:0 15px 40px rgba(0,0,0,.25);
}

.logo{
    width:85px;
    height:85px;
    margin:20px auto;
    border-radius:25px;
    background:#fff;
    color:#0b4f8a;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:42px;
    box-shadow:0 10px 25px rgba(0,0,0,.2);
}

h1{
    text-align:center;
    margin-bottom:10px;
}

.subtitle{
    text-align:center;
    color:#dbeafe;
    margin-bottom:25px;
}

label{
    display:block;
    margin:12px 0 7px;
}

input{
    width:100%;
    padding:14px;
    border:none;
    outline:none;
    border-radius:14px;
    background:#fff;
    color:#111;
    font-size:16px;
}

button{
    width:100%;
    border:0;
    padding:15px;
    border-radius:15px;
    margin-top:18px;
    background:#1683e8;
    color:white;
    font-size:17px;
    font-weight:bold;
    cursor:pointer;
}

button:hover{
    opacity:.9;
}

.secondary{
    background:rgba(255,255,255,.12);
}

.header{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:20px;
}

.header-title{
    font-size:23px;
    font-weight:bold;
}

.logout{
    width:auto;
    margin:0;
    padding:9px 14px;
    font-size:14px;
    background:#dc3545;
}

.profile{
    text-align:center;
    padding:25px 10px;
}

.avatar{
    width:85px;
    height:85px;
    border-radius:50%;
    margin:auto;
    background:#1683e8;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:35px;
    border:4px solid rgba(255,255,255,.5);
}

.profile h2{
    margin-top:12px;
}

.cards{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:14px;
    margin-top:20px;
}

.menu-card{
    padding:20px 12px;
    border-radius:20px;
    background:rgba(255,255,255,.10);
    text-align:center;
    cursor:pointer;
    border:1px solid rgba(255,255,255,.12);
}

.menu-card .icon{
    font-size:35px;
    margin-bottom:10px;
}

.menu-card span{
    display:block;
    font-weight:bold;
}

.digital-card{
    background:linear-gradient(135deg,#0d6efd,#123d7a);
    border-radius:25px;
    padding:22px;
    margin-top:15px;
    box-shadow:0 15px 30px rgba(0,0,0,.25);
}

.digital-top{
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.digital-logo{
    font-size:35px;
}

.digital-card h2{
    margin:15px 0;
}

.info{
    background:rgba(255,255,255,.10);
    padding:12px;
    border-radius:13px;
    margin-top:8px;
}

.info small{
    color:#dbeafe;
}

.info strong{
    display:block;
    margin-top:4px;
}

.qr{
    width:130px;
    height:130px;
    background:white;
    margin:20px auto 5px;
    display:flex;
    align-items:center;
    justify-content:center;
    color:#111;
    font-weight:bold;
    font-size:13px;
    text-align:center;
}

.back{
    background:rgba(255,255,255,.12);
}

.notice{
    background:rgba(255,193,7,.15);
    border:1px solid rgba(255,193,7,.35);
    color:#ffe8a1;
    padding:12px;
    border-radius:14px;
    margin-top:18px;
    font-size:13px;
    line-height:1.7;
}

footer{
    text-align:center;
    color:#b9cbe0;
    font-size:12px;
    margin:25px 0 10px;
}
</style>
</head>

<body>

<div class="container">

<!-- LOGIN -->
<section id="loginScreen">

    <div class="logo">🪪</div>

    <div class="card">

        <h1>KURD PASS</h1>

        <p class="subtitle">
            ناسنامەی دیجیتاڵی تایبەتی
        </p>

        <label>ناوی بەکارهێنەر</label>
        <input id="loginName" type="text" placeholder="ناوت بنووسە">

        <label>وشەی نهێنی</label>
        <input id="loginPassword" type="password" placeholder="وشەی نهێنی">

        <button onclick="login()">
            چوونەژوورەوە
        </button>

        <button class="secondary" onclick="demoLogin()">
            چوونەژوورەوەی تاقیکردنەوە
        </button>

        <div class="notice">
            ئەم سیستەمە نموونەییە و ناسنامە یان بەڵگەنامەی فەرمی حکومەت نییە.
        </div>

    </div>

    <footer>
        KURD PASS © 2026
    </footer>

</section>
